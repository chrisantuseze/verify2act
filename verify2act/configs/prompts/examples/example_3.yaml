# Few-shot example: reflect behavior — critic rejects a plan, VLM revises
task: example_3
instruction: "Assemble all nuts onto their matching pegs."
objects:
  - "round nut"
  - "square nut"
history:
  - "pick round nut"

# Original plan that the critic rejected
plan:
  - "insert round nut"
  - "pick square nut"
  - "reorient square nut"
  - "insert square nut"

# Images (relative to this file)
current_image: example_3_current.png
goal_image: example_3_goal.png
imagined_image: example_3_imagined.png
gradcam_image: example_3_gradcam.png

# Critic diagnosis (used to populate the reflect user message)
failed_step: 2
failed_action: "reorient square nut"
mean_feasibility: 0.18
uncertainty: 0.05
score_trajectory:
  - [0.82, 0.04]
  - [0.71, 0.06]
  - [0.18, 0.05]
failure_pattern: "sudden_drop"
worst_region: "center"

# Reflect expected response
analysis: "The reorient action is unnecessary — the square nut can be inserted directly after picking."
revised_plan:
  - "insert round nut"
  - "pick square nut"
  - "insert square nut"
  - "done"

# OpenAI
role: system
name: Null
name_query: example_user
name_response: example_assistant
