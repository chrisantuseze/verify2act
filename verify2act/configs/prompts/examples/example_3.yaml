  - "left round nut (id: RoundNut0)"
  - "right round nut (id: RoundNut1)"
history: []

# Original nut ordering that the critic rejected
plan:
  - {"label": "left round nut", "id": "RoundNut0"}
  - {"label": "right round nut", "id": "RoundNut1"}

